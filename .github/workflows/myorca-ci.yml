name: MyOrca CI

on:
  push:
    branches:
      - custom
  pull_request:
    branches:
      - custom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Plugin Tests
        run: pnpm exec vitest run src/shared/plugins

  build-windows:
    name: Windows Build & Artifact Package
    runs-on: windows-2022
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Desktop Assets
        run: pnpm run build:desktop

      - name: Build Native Windows Components
        run: pnpm run build:native

      - name: Build Unpacked Application Package
        run: pnpm run build:unpack

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyOrca-Windows-x64
          path: dist/win-unpacked/
          retention-days: 14
